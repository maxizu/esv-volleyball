name: Daten aktualisieren

on:
  schedule:
    - cron: "7 * * * *" # stuendlich
  workflow_dispatch: # manuell startbar

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Daten von der BVV-Schnittstelle holen
        run: node scripts/fetch-data.mjs
        env:
          BVV_API_KEY: ${{ secrets.BVV_API_KEY }}
      - name: Committen und pushen (nur bei Aenderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bvv.json
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Daten aktualisiert"
          git pull --rebase
          git push
