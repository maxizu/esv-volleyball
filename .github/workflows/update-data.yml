name: Daten aktualisieren

on:
  schedule:
    # Zeiten in UTC. Mo-Do alle 30 Min, Fr-So alle 5 Min (Spieltage).
    # Bei Aenderung auch SNAPSHOT.scheduleText in js/config.js anpassen (Footer-Hinweis).
    # Minuten bewusst nicht auf :00, da GitHub dort stark ausgelastet ist.
    - cron: "7,37 * * * 1-4"
    - cron: "3-58/5 * * * 5,6,0"
  workflow_dispatch: # manuell startbar

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Daten von der BVV-Schnittstelle holen
        run: node scripts/fetch-data.mjs
        env:
          BVV_API_KEY: ${{ secrets.BVV_API_KEY }}
      - name: Committen und pushen (nur bei Aenderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bvv.json
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Daten aktualisiert"
          git pull --rebase
          git push
